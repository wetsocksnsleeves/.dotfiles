// Keep cookies and site storage across restarts so logins persist.
// LibreWolf ships privacy.sanitize.sanitizeOnShutdown=true, which wipes them on exit.
defaultPref("privacy.sanitize.sanitizeOnShutdown", false);
defaultPref("privacy.clearOnShutdown_v2.cookiesAndStorage", false);
defaultPref("privacy.clearOnShutdown_v2.cache", false);

// Load chrome/userChrome.css and chrome/userContent.css from the profile.
defaultPref("toolkit.legacyUserProfileCustomizations.stylesheets", true);
// Browser Toolbox (Ctrl+Alt+Shift+I) for inspecting the browser UI.
// librewolf.cfg resets remote-enabled with pref() on every start, so pref() is needed here.
defaultPref("devtools.chrome.enabled", true);
pref("devtools.debugger.remote-enabled", true);

// Let SVGs loaded from file:// (the userChrome chrome/ folder) use context-fill/context-stroke.
// Without it, sidebery.svg ignores the CSS fill and renders black.
defaultPref("svg.context-properties.content.enabled", true);
